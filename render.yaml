services:
  - type: web
    name: imagefree-2api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: UPSTREAM_BASE
        value: https://imagefree.net
